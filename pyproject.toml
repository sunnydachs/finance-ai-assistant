[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ai-assistant"
version = "0.1.0"
description = "RAG Q&A assistant for a fictional bank, with tool use, guardrails, and an evaluation suite"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "anthropic>=1.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Demo build (scripts/build_demo.py): VOICEVOX server + ffmpeg must be on
# the system; Pillow is the only Python extra it needs.
demo = ["Pillow>=10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
